name: Ubuntu-CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: "${{ matrix.cfg.runs_on }}"
    name: "${{ matrix.cfg.name }}"
    strategy:
      matrix:
        cfg:
          - runs_on: ubuntu-24.04
            qt_kf_pkgs: qtbase5-dev libkf5syntaxhighlighting-dev
            name: Ubuntu-24.04-qt5
          - runs_on: ubuntu-26.04-arm
            qt_kf_pkgs: qt6-base-dev libkf6syntaxhighlighting-dev
            name: Ubuntu-26.04-arm-qt6
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install ${{ matrix.cfg.qt_kf_pkgs }} libicu-dev
      - name: Build qtextpad
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/dist ..
          make -j2 && make install
